<!doctype html>
<html lang="en">

<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style>
<title>Flag Drill</title>
<style>
/* Layout: one-screen drill — mode switch, filters, stat strip, then a prompt card over a 2-column answer grid */
:root{
  --bg:#eef2f7; --surface:#ffffff; --ink:#13213a; --muted:#5a6a82; --line:#d5dde8;
  --accent:#2347c5; --accent-ink:#ffffff; --good:#17824a; --good-bg:#e3f4ea; --bad:#c42f2f; --bad-bg:#fbe7e7;
  --display:"Avenir Next Condensed","Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Avenir Next",system-ui,-apple-system,"Segoe UI",sans-serif;
  --flag:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0d1420; --surface:#162032; --ink:#e7ecf4; --muted:#93a1b6; --line:#2a374d;
  --accent:#7f9cff; --accent-ink:#0d1420; --good:#4cc784; --good-bg:#15301f; --bad:#f07070; --bad-bg:#3a1a1c; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d1420; --surface:#162032; --ink:#e7ecf4; --muted:#93a1b6; --line:#2a374d;
  --accent:#7f9cff; --accent-ink:#0d1420; --good:#4cc784; --good-bg:#15301f; --bad:#f07070; --bad-bg:#3a1a1c; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;-webkit-tap-highlight-color:transparent}
.wrap{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:14px 28px;display:flex;flex-direction:column;gap:12px}
header{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
h1{font-family:var(--display);font-weight:700;font-size:1.7rem;letter-spacing:.02em;margin:0;text-transform:uppercase}
.mastery{font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums}
.mastery b{color:var(--ink)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px;gap:4px}
.seg button{font:600 .95rem var(--body);border:0;background:transparent;color:var(--muted);padding:10px 4px;border-radius:9px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0}
.chips::-webkit-scrollbar{display:none}
.chip{font:500 .85rem var(--body);white-space:nowrap;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:6px 11px;border-radius:999px;cursor:pointer}
.chip[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);font-weight:600}
.count{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--surface)}
.count button{font:600 .85rem var(--body);border:0;background:transparent;color:var(--muted);padding:6px 12px;cursor:pointer}
.count button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.stat{display:flex;flex-direction:column;align-items:center;gap:1px}
.stat span{font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.stat b{font-family:var(--display);font-size:1.45rem;font-variant-numeric:tabular-nums;line-height:1.1}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;min-height:200px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:18px 12px;text-align:center;cursor:default;user-select:none}
.bigflag{font-family:var(--flag);font-size:clamp(7rem,34vw,10rem);line-height:1}
.bigname{font-family:var(--display);font-weight:700;font-size:clamp(2rem,9vw,2.8rem);line-height:1.05;text-wrap:balance}
.hint{font-size:.8rem;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.feedback{min-height:1.4em;font-weight:600;font-size:.95rem}
.feedback.good{color:var(--good)} .feedback.bad{color:var(--bad)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.opt{font:600 1rem var(--body);color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:14px 10px;min-height:62px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;text-align:center;line-height:1.2;touch-action:manipulation}
.opt:active{transform:scale(.98)}
.opt:focus-visible,.chip:focus-visible,.seg button:focus-visible,.count button:focus-visible,.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.opt .f{font-family:var(--flag);font-size:1.4rem;line-height:1}
.opts.flags .opt{flex-direction:column;gap:2px;min-height:96px;padding:10px 6px}
.opts.flags .opt .f{font-size:3.6rem}
.opts.flags .opt .lbl{font-size:.78rem;font-weight:500;color:var(--muted)}
.opt.right{border-color:var(--good);background:var(--good-bg);color:var(--good)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg);color:var(--bad)}
.opt[disabled]{cursor:default}
.type{display:flex;gap:8px}
.type input{flex:1;min-width:0;font:500 1.1rem var(--body);color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:13px 14px}
.type input:focus{outline:none;border-color:var(--accent)}
.btn{font:600 1rem var(--body);border:0;border-radius:12px;padding:0 16px;cursor:pointer;background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;color:var(--muted);border:1.5px solid var(--line)}
footer{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:.8rem;color:var(--muted)}
footer button{font:500 .8rem var(--body);background:none;border:0;color:var(--muted);text-decoration:underline;cursor:pointer;padding:4px}
.confirm[hidden]{display:none}
.confirm{display:flex;gap:8px;align-items:center}
.confirm button.danger{color:var(--bad);font-weight:600}
@media (prefers-reduced-motion:reduce){.opt:active{transform:none}}
</style>
</head>
<body>


<div class="wrap">
  <header>
    <h1>Flag Drill</h1>
    <div class="mastery"><b id="mastered">0</b> / <span id="poolsize">197</span> mastered</div>
  </header>

  <div class="seg" role="group" aria-label="Mode">
    <button id="m-name" data-mode="name" aria-pressed="true">Name it</button>
    <button id="m-type" data-mode="type" aria-pressed="false">Type it</button>
    <button id="m-find" data-mode="find" aria-pressed="false">Find it</button>
  </div>

  <div class="row">
    <div class="chips" id="regions" role="group" aria-label="Region"></div>
    <div class="count" id="count" role="group" aria-label="Number of choices">
      <button id="n4" data-n="4" aria-pressed="true">4</button>
      <button id="n6" data-n="6" aria-pressed="false">6</button>
    </div>
  </div>

  <div class="stats">
    <div class="stat"><span>Streak</span><b id="s-streak">0</b></div>
    <div class="stat"><span>Best</span><b id="s-best">0</b></div>
    <div class="stat"><span>Session</span><b id="s-score">0/0</b></div>
    <div class="stat"><span>Accuracy</span><b id="s-acc">–</b></div>
  </div>

  <div class="card" id="card"></div>
  <div class="feedback" id="feedback" aria-live="polite"></div>
  <div id="answers"></div>

  <footer>
    <span id="tip">Tap the card to skip ahead after a miss</span>
    <span>
      <button id="reset">Reset progress</button>
      <span class="confirm" id="confirm" hidden>Clear all progress? <button class="danger" id="yes">Clear</button><button id="no">Cancel</button></span>
    </span>
  </footer>
</div>

<script>
const RAW=`DZ|Algeria|AF
AO|Angola|AF
BJ|Benin|AF
BW|Botswana|AF
BF|Burkina Faso|AF
BI|Burundi|AF
CV|Cape Verde|AF|Cabo Verde

CI|Ivory Coast|AF|Cote d'Ivoire
DJ|Djibouti|AF
EG|Egypt|AF

ET|Ethiopia|AF

ST|São Tomé and Príncipe|AF|Sao Tome;Sao Tome and Principe

AG|Antigua and Barbuda|AM|Antigua
AR|Argentina|AM
BS|Bahamas|AM|The Bahamas
BB|Barbados|AM

CA|Canada|AM

CR|Costa Rica|AM

NI|Nicaragua|AM

KN|Saint Kitts and Nevis|AM|St Kitts;St Kitts and Nevis;Saint Kitts
LC|Saint Lucia|AM|St Lucia
VC|Saint Vincent and the Grenadines|AM|St Vincent;Saint Vincent;St Vincent and the Grenadines
SR|Suriname|AM|Surinam
TT|Trinidad and Tobago|AM|Trinidad
US|United States|AM|USA;US;America;United States of America

MV|Maldives|AS

NP|Nepal|AS
KP|North Korea|AS
OM|Oman|AS
PK|Pakistan|AS
PS|Palestine|AS
PH|Philippines|AS
QA|Qatar|AS
SA|Saudi Arabia|AS
SG|Singapore|AS
KR|South Korea|AS|Korea
LK|Sri Lanka|AS
SY|Syria|AS
TW|Taiwan|AS
TJ|Tajikistan|AS
TH|Thailand|AS
TL|Timor-Leste|AS|East Timor;Timor Leste
TR|Turkey|AS|Turkiye
TM|Turkmenistan|AS
AE|United Arab Emirates|AS|UAE;Emirates
UZ|Uzbekistan|AS
VN|Vietnam|AS|Viet Nam
YE|Yemen|AS
AL|Albania|EU
AD|Andorra|EU

BY|Belarus|EU

LI|Liechtenstein|EU

LU|Luxembourg|EU
MT|Malta|EU
MD|Moldova|EU
MC|Monaco|EU
ME|Montenegro|EU
NL|Netherlands|EU|Holland
MK|North Macedonia|EU|Macedonia
NO|Norway|EU
PL|Poland|EU
PT|Portugal|EU
RO|Romania|EU
RU|Russia|EU
SM|San Marino|EU
RS|Serbia|EU
SK|Slovakia|EU
SI|Slovenia|EU
ES|Spain|EU
SE|Sweden|EU
CH|Switzerland|EU
UA|Ukraine|EU
GB|United Kingdom|EU|UK;Britain;Great Britain;England
VA|Vatican City|EU|Vatican;Holy See
AU|Australia|OC
FJ|Fiji|OC
KI|Kiribati|OC
MH|Marshall Islands|OC
FM|Micronesia|OC
NR|Nauru|OC
NZ|New Zealand|OC
PW|Palau|OC
PG|Papua New Guinea|OC|PNG
WS|Samoa|OC
SB|Solomon Islands|OC
TO|Tonga|OC
TV|Tuvalu|OC
VU|Vanuatu|OC`;

// Flags people mix up — used first as wrong answers so practice targets real confusions
const LOOKALIKES=[
 "ID MC PL SG","TD RO AD MD","AU NZ TV FJ","IE CI IT IN NE","NL LU RU FR HR SI SK RS PY",
 "NO IS DK SE FI GB","VE CO EC","SN ML GN CM GH BO LT ET","HN NI SV GT AR",
 "SY EG IQ YE SD","KW AE JO PS SD","QA BH","LV AT LB PE CA","MY US LR CL PR",
 "BE DE UG","CU PR? GR UY","TT KN AG","CZ PH PS","LY ER","DZ PK TN TR AZ MV","GA SL RW",
 "SA PK","JP BD PW LA KR","CN VN","AL ME","KZ PW","ZW ZA ZM","MR NG",
 "CG TZ CD","BN MY","HU BG IT","SK SI RU RS","IR TJ IN","MU SC","EE BW SL",
 "GQ BS","TO GE CH DK","VA CV","AM CO"
].map(s=>s.replace(/\?/g,"").split(" ").filter(Boolean));

const REGIONS=[["ALL","All"],["AF","Africa"],["AM","Americas"],["AS","Asia"],["EU","Europe"],["OC","Oceania"]];

const C=RAW.trim().split("\n").map(l=>{const [c,n,r,a]=l.split("|");return {c,n,r,alt:a?a.split(";"):[]}});
const BY=Object.fromEntries(C.map(x=>[x.c,x]));
const flag=c=>String.fromCodePoint(...[...c].map(ch=>0x1F1E6+ch.charCodeAt(0)-65));

const norm=s=>s.normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase()
  .replace(/&/g," and ").replace(/\bst\.?\s/g,"saint ").replace(/[^a-z ]/g," ")
  .replace(/\b(the|of)\b/g," ").replace(/\s+/g," ").trim();
C.forEach(x=>x.keys=[x.n,...x.alt].map(norm));
const ALLKEYS=new Map(); C.forEach(x=>x.keys.forEach(k=>ALLKEYS.set(k,x.c)));

function lev(a,b){const m=a.length,n=b.length;let p=Array.from({length:n+1},(_,i)=>i);
  for(let i=1;i<=m;i++){const q=[i];for(let j=1;j<=n;j++)q[j]=Math.min(p[j]+1,q[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));p=q}return p[n]}
function matches(guess,x){
  const g=norm(guess); if(!g) return false;
  const owner=ALLKEYS.get(g); if(owner) return owner===x.c;   // exact name of some country
  return x.keys.some(k=>{const t=k.length>8?2:k.length>4?1:0;return lev(g,k)<=t});
}

/* ---------- state ---------- */
const store={get(k,d){try{const v=localStorage.getItem("flagdrill:"+k);return v?JSON.parse(v):d}catch(e){return d}},
             set(k,v){try{localStorage.setItem("flagdrill:"+k,JSON.stringify(v))}catch(e){}}};
let mode=store.get("mode","name"), N=store.get("n",4), region=store.get("region","ALL");
let box=store.get("box",{}), best=store.get("best",0);
let streak=0, sRight=0, sTotal=0, recent=[], current=null, locked=false, timer=null;

const $=id=>document.getElementById(id);
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const pool=()=>C.filter(x=>region==="ALL"||x.r===region);

function pick(){
  const p=pool(); const avoid=new Set(recent.slice(-Math.min(8,p.length-1)));
  const cand=p.filter(x=>!avoid.has(x.c));
  // Leitner-style weighting: new or missed flags come up far more often than mastered ones
  const w=cand.map(x=>{const b=box[x.c];return b===undefined?6:Math.pow(2,5-Math.min(b,5))});
  let r=Math.random()*w.reduce((a,b)=>a+b,0);
  for(let i=0;i<cand.length;i++){r-=w[i];if(r<=0)return cand[i]}
  return cand[cand.length-1];
}
function distractors(t,k){
  const out=[],seen=new Set([t.c]);
  const add=c=>{if(out.length<k&&BY[c]&&!seen.has(c)){seen.add(c);out.push(BY[c])}};
  const look=shuffle(LOOKALIKES.filter(g=>g.includes(t.c)).flat());
  look.slice(0,Math.ceil(k/2)+1).forEach(add);
  shuffle(C.filter(x=>x.r===t.r).map(x=>x.c)).forEach(add);
  shuffle(C.map(x=>x.c)).forEach(add);
  return out;
}

/* ---------- UI ---------- */
function renderControls(){
  document.querySelectorAll(".seg button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.mode===mode));
  document.querySelectorAll("#count button").forEach(b=>b.setAttribute("aria-pressed",+b.dataset.n===N));
  $("count").style.visibility=mode==="type"?"hidden":"visible";
  $("regions").innerHTML=REGIONS.map(([k,l])=>`<button class="chip" id="r-${k}" data-r="${k}" aria-pressed="${k===region}">${l}</button>`).join("");
}
function renderStats(){
  const p=pool();
  $("mastered").textContent=p.filter(x=>(box[x.c]||0)>=3).length;
  $("poolsize").textContent=p.length;
  $("s-streak").textContent=streak; $("s-best").textContent=best;
  $("s-score").textContent=sRight+"/"+sTotal;
  $("s-acc").textContent=sTotal?Math.round(100*sRight/sTotal)+"%":"–";
}
function next(){
  clearTimeout(timer); locked=false; $("feedback").textContent=""; $("feedback").className="feedback";
  current=pick(); recent.push(current.c); if(recent.length>20)recent.shift();
  const card=$("card"), ans=$("answers");
  if(mode==="find"){
    card.innerHTML=`<div class="hint">Tap the flag of</div><div class="bigname">${current.n}</div>`;
  }else{
    card.innerHTML=`<div class="bigflag" role="img" aria-label="Flag to identify">${flag(current.c)}</div>`;
  }
  if(mode==="type"){
    ans.innerHTML=`<form class="type" id="tform" autocomplete="off"><input id="guess" placeholder="Country name" autocapitalize="words" spellcheck="false" enterkeyhint="go"><button class="btn" type="submit">Go</button><button class="btn ghost" type="button" id="skip">Skip</button></form>`;
    const g=$("guess"); setTimeout(()=>g.focus({preventScroll:true}),30);
    $("tform").onsubmit=e=>{e.preventDefault();if(locked)return;const v=g.value;if(!v.trim())return;resolve(matches(v,current),null)};
    $("skip").onclick=()=>{if(!locked)resolve(false,null)};
    return;
  }
  const opts=shuffle([current,...distractors(current,N-1)]);
  ans.innerHTML=`<div class="opts ${mode==="find"?"flags":""}">`+opts.map((x,i)=>
    mode==="find"
     ?`<button class="opt" data-c="${x.c}" aria-label="Option ${i+1}"><span class="f">${flag(x.c)}</span><span class="lbl" hidden>${x.n}</span></button>`
     :`<button class="opt" data-c="${x.c}"><span class="f" hidden>${flag(x.c)}</span><span>${x.n}</span></button>`
  ).join("")+`</div>`;
}
function resolve(ok,pickedCode){
  locked=true; sTotal++;
  const c=current.c;
  if(ok){sRight++;streak++;box[c]=(box[c]||0)+1;if(streak>best){best=streak;store.set("best",best)}}
  else{streak=0;box[c]=0}
  store.set("box",box);
  const fb=$("feedback");
  fb.className="feedback "+(ok?"good":"bad");
  if(mode==="type"){
    fb.textContent=ok?`Correct — ${current.n}`:`It's ${current.n}`;
    $("guess").disabled=true;
  }else{
    document.querySelectorAll(".opt").forEach(b=>{
      b.disabled=true;
      b.querySelectorAll("[hidden]").forEach(h=>h.hidden=false);
      if(b.dataset.c===c)b.classList.add("right");
      else if(b.dataset.c===pickedCode)b.classList.add("wrong");
    });
    if(ok) fb.textContent="Correct";
    else fb.textContent = mode==="find"
      ? `You tapped ${BY[pickedCode].n}`
      : `That's ${current.n}. ${BY[pickedCode].n} is ${flag(pickedCode)}`;
  }
  renderStats();
  timer=setTimeout(next, ok?450:1800);
}

/* ---------- events ---------- */
$("answers").addEventListener("click",e=>{const b=e.target.closest(".opt");if(!b||locked)return;resolve(b.dataset.c===current.c,b.dataset.c)});
$("card").addEventListener("click",()=>{if(locked)next()});
document.querySelector(".seg").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;mode=b.dataset.mode;store.set("mode",mode);renderControls();next()});
$("count").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;N=+b.dataset.n;store.set("n",N);renderControls();next()});
$("regions").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;region=b.dataset.r;store.set("region",region);recent=[];renderControls();renderStats();next()});
document.addEventListener("keydown",e=>{
  if(mode==="type"||e.target.tagName==="INPUT")return;
  if(locked&&(e.key===" "||e.key==="Enter")){e.preventDefault();next();return}
  const i=+e.key; if(i>=1&&i<=6){const b=document.querySelectorAll(".opt")[i-1];if(b&&!locked)b.click()}
});
$("reset").onclick=()=>{$("reset").hidden=true;$("confirm").hidden=false};
$("no").onclick=()=>{$("reset").hidden=false;$("confirm").hidden=true};
$("yes").onclick=()=>{box={};best=0;streak=0;sRight=0;sTotal=0;store.set("box",box);store.set("best",0);$("no").onclick();renderStats();next()};

renderControls(); renderStats(); next();
if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
